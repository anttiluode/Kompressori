<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Gate 3 perturbation transfer amplitude sweep</title>
<desc id="desc">For the maximum-gain pair found in a 300-pair scan, transfer gain stays near one for tiny A, dips below one, then rises to 1.466 at epsilon A 0.1 before declining.</desc>
<rect width="900" height="460" rx="22" fill="#0f1218"/>
<text x="70" y="28" fill="#eef2ff" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Gate 3 — A prepares the response to B</text>
<text x="70" y="50" fill="#9aa4bd" font-family="system-ui,sans-serif" font-size="13">selected existence example: pair 49 of 300; B epsilon = 0.002</text>
<!-- plot area -->
<line x1="70" y1="350" x2="770" y2="350" stroke="#49546b"/>
<line x1="70" y1="30" x2="70" y2="350" stroke="#49546b"/>
<!-- y grid -->
<g fill="#9aa4bd" font-family="system-ui,sans-serif" font-size="12">
  <line x1="70" y1="325.4" x2="770" y2="325.4" stroke="#232a38"/><text x="34" y="329">0.90</text>
  <line x1="70" y1="276.2" x2="770" y2="276.2" stroke="#6f7788" stroke-dasharray="5 5"/><text x="34" y="280">1.00</text>
  <line x1="70" y1="177.7" x2="770" y2="177.7" stroke="#232a38"/><text x="34" y="182">1.20</text>
  <line x1="70" y1="79.2" x2="770" y2="79.2" stroke="#232a38"/><text x="34" y="83">1.40</text>
  <text x="6" y="205" transform="rotate(-90 18 205)">transfer gain</text>
</g>
<!-- x ticks -->
<g fill="#9aa4bd" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle">
  <line x1="70" y1="350" x2="70" y2="356" stroke="#697386"/><text x="70" y="374">0</text>
  <line x1="245" y1="350" x2="245" y2="356" stroke="#697386"/><text x="245" y="374">0.05</text>
  <line x1="420" y1="350" x2="420" y2="356" stroke="#697386"/><text x="420" y="374">0.10</text>
  <line x1="595" y1="350" x2="595" y2="356" stroke="#697386"/><text x="595" y="374">0.15</text>
  <line x1="770" y1="350" x2="770" y2="356" stroke="#697386"/><text x="770" y="374">0.20</text>
  <text x="420" y="405">preparation amplitude εA</text>
</g>
<polyline fill="none" stroke="#f6c85f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="70,276.2 77,276.6 87.5,278.3 105,283 140,296.7 175,311.1 245,300.7 315,150.5 420,46.6 490,98.2 595,166.4 770,194.4"/>
<g fill="#f6c85f" stroke="#0f1218" stroke-width="2">
  <circle cx="70" cy="276.2" r="5"/><circle cx="77" cy="276.6" r="5"/><circle cx="87.5" cy="278.3" r="5"/><circle cx="105" cy="283" r="5"/><circle cx="140" cy="296.7" r="5"/><circle cx="175" cy="311.1" r="5"/><circle cx="245" cy="300.7" r="5"/><circle cx="315" cy="150.5" r="5"/><circle cx="420" cy="46.6" r="7"/><circle cx="490" cy="98.2" r="5"/><circle cx="595" cy="166.4" r="5"/><circle cx="770" cy="194.4" r="5"/>
</g>
<text x="435" y="53" fill="#f6c85f" font-family="system-ui,sans-serif" font-size="14" font-weight="700">1.466×</text>
<text x="435" y="70" fill="#cbd3e6" font-family="system-ui,sans-serif" font-size="12">prepared state changed ≈5.1%</text>
<text x="70" y="438" fill="#7f899f" font-family="system-ui,sans-serif" font-size="11">Post-selected pair: this shows an existence example, not how common amplification is.</text>
</svg>
